[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcris-clean"
version = "0.1.0"
description = "Parse and clean raw CMS Healthcare Cost Report Information System (HCRIS) flat files into tidy, analysis-ready hospital financial panels."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Abiola Olayinka" },
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/lukola123/hcris_clean"
Issues = "https://github.com/lukola123/hcris_clean/issues"

[tool.setuptools.packages.find]
where = ["src"]
